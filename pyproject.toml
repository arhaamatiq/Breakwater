[project]
name = "breakwater"
version = "0.4.0.dev0"
description = "Verifier regression testing for AI agent benchmarks, on a fault-tolerant distributed eval runner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.29",
    "docker>=7.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breakwater"]

# Non-Python package data, listed explicitly so an installed wheel can migrate a
# database (breakwater.setup reads schema.sql via importlib.resources) and bring
# up its services (compose.yml) without a repo checkout.
[tool.hatch.build.targets.wheel.force-include]
"src/breakwater/schema.sql" = "breakwater/schema.sql"
"src/breakwater/compose.yml" = "breakwater/compose.yml"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
