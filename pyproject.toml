[project]
name = "projectx"
version = "0.1.0"
description = "Fault-tolerant distributed AI evaluation platform: at-least-once execution, exactly-once result effect"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.29",
    "docker>=7.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projectx"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
