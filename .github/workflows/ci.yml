name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: breakwater
          POSTGRES_PASSWORD: breakwater
          POSTGRES_DB: breakwater
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U breakwater" --health-interval 2s
          --health-timeout 2s --health-retries 30
    env:
      BW_TEST_DSN: postgresql://breakwater:breakwater@127.0.0.1:55432/breakwater
      BW_ARTIFACTS: file:///tmp/bw-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync
      # unit + real-Postgres integration tests: claims, leases, fencing,
      # fair scheduling, seeded fault injection, schema upgrades, Harbor
      # verdict rules, bundle normalization
      - run: uv run pytest -q
      - name: CLI smoke
        run: |
          uv run breakwater --help
          uv run python -m breakwater.setup
