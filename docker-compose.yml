services:
  postgres:
    image: postgres:16-alpine
    container_name: projectx-postgres
    environment:
      POSTGRES_USER: projectx
      POSTGRES_PASSWORD: projectx
      POSTGRES_DB: projectx
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectx"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    container_name: projectx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: projectx
      MINIO_ROOT_PASSWORD: projectx123
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
